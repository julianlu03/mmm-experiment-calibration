version: 2

models:
  - name: mart_mmm__state_week
    description: >
      MMM input: weekly net sales (KPI), spend by channel, promo share, and
      geo-experiment flags for every state-week. Contract-enforced because
      Meridian and the experiment analysis depend on these exact columns and
      types. Unknown-geo ad spend and no-region Shopify sales are excluded.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - state_code
              - week_start
    columns:
      - name: state_code
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: state_name
        data_type: string
      - name: census_region
        data_type: string
      - name: population
        data_type: int64
        description: 2020 Census population. Meridian uses it to scale media and KPI per capita.
        data_tests:
          - not_null
      - name: week_start
        data_type: date
        description: Monday that starts the week.
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: net_sales
        data_type: float64
        description: KPI. Shopify gross sales + discounts + returns, summed to the week. USD.
        data_tests:
          - not_null
      - name: spend_paid_search
        data_type: float64
        description: Google Ads SEARCH spend. $0 in treated states during the test window.
        data_tests:
          - not_null
      - name: spend_paid_social
        data_type: float64
        description: Meta Ads spend.
        data_tests:
          - not_null
      - name: spend_online_video
        data_type: float64
        description: Google Ads VIDEO (YouTube) spend. $0 between flights. A “flight” is a burst of ad activity. They run in bursts, several weeks on, then several weeks off.
        data_tests:
          - not_null
      - name: promo_share
        data_type: float64
        description: Share of the week's days inside a national promo (0 to 1). MMM control variable.
        data_tests:
          - not_null
      - name: is_treated_geo
        data_type: bool
        description: True for the 10 states in the geo holdout's treatment group (all weeks).
        data_tests:
          - not_null
      - name: is_test_period
        data_type: bool
        description: True for weeks inside the test window, for every state. The DiD "post" indicator.
        data_tests:
          - not_null
      - name: is_search_paused
        data_type: bool
        description: True only for treated states during the test window (is_treated_geo and is_test_period).
        data_tests:
          - not_null

  - name: mart_platform__channel_performance
    description: >
      Calculates the claimed spend, conversions value, and ROAS for Google and Meta platforms. Used
      later for comparison against MMM and truth. 
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - channel
              - week_start
    columns:
      - name: week_start
        description: Monday that starts the week.
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: channel
        description: Specifies which channel (paid search, social, or video).
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['paid_search', 'paid_social', 'online_video']
      - name: spend
        description: Total weekly cost per channel.
        data_tests:
          - not_null
      - name: platform_conversion_value
        description: Claimed conversion value per channel. 
        data_tests:
          - not_null
      - name: platform_roas

        description: Platform-claimed revenue per $1 of spend. Spend is always above zero at this grain.”
        data_tests:
          - not_null
